#  ┌─────────────────────────────────────────────────────────┐
#  │  Deploy to Cloud Run via Cloud Build                   │
#  │  • main         → auto-build + deploy to production    │
#  │  • other branch → manual "Run workflow" → dev deploy   │
#  └─────────────────────────────────────────────────────────┘

name: Deploy to Cloud Run via Cloud Build

on:
  # Automatic path
  push:
    branches: [ main ]

  # Manual path (adds the "Run workflow" button on every branch)
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'  # needed for OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/49477009498/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          # The service account you created for CI/CD
          service_account: github-actions@floofgg.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: floofgg

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install deps & run unit-tests
        run: |
          set -e                       # fail fast
          npm ci
          node tests/test_epub_processor.js || exit 1

      - name: Set environment variables
        id: env
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "SERVICE_NAME=progressive-reader" >> $GITHUB_OUTPUT
            echo "ENVIRONMENT=prod"                    >> $GITHUB_OUTPUT
          else
            echo "SERVICE_NAME=progressive-reader-dev"  >> $GITHUB_OUTPUT
            echo "ENVIRONMENT=dev"                     >> $GITHUB_OUTPUT
          fi

      - name: Submit build to Cloud Build
        run: |
          gcloud builds submit \
            --project=floofgg \
            --config=cloudbuild.yaml \
            --substitutions=COMMIT_SHA=${{ github.sha }},_SERVICE_NAME=${{ steps.env.outputs.SERVICE_NAME }},_ENVIRONMENT=${{ steps.env.outputs.ENVIRONMENT }} \
            --gcs-log-dir=gs://floofgg_cloudbuild/logs \
            .
