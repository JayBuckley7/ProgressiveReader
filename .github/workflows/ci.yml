name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Generate TypeScript types
        run: python scripts/generate_ts_types.py
      - name: Run backend tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate TypeScript types
        run: python scripts/generate_ts_types.py
      - name: Verify types are up to date
        run: git diff --exit-code frontend/src/types/api.ts || (echo "Types are out of sync! Run 'python scripts/generate_ts_types.py' to update." && exit 1)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Run tests (part 1)
        working-directory: frontend
        run: npm run -s test:part1
      - name: Run tests (part 2)
        working-directory: frontend
        run: npm run -s test:part2

