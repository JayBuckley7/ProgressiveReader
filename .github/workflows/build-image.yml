name: Build Docker Image

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after migration and staging release gates have passed"
        type: boolean
        required: false
        default: false

jobs:
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/49477009498/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@floofgg.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: floofgg

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies (frontend)
        working-directory: frontend
        run: |
          set -e
          npm ci

      - name: Set environment variables
        id: env
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "SERVICE_NAME=progressive-reader"  >> $GITHUB_OUTPUT
            echo "ENVIRONMENT=prod"                 >> $GITHUB_OUTPUT
          else
            echo "SERVICE_NAME=progressive-reader-dev" >> $GITHUB_OUTPUT
            echo "ENVIRONMENT=dev"                  >> $GITHUB_OUTPUT
          fi

      - name: Submit build to Cloud Build
        env:
          DEPLOY: ${{ inputs.deploy || false }}
        run: |
          gcloud builds submit \
            --project=floofgg \
            --config=cloudbuild.yaml \
            --substitutions=_COMMIT_SHA=${{ github.sha }},_SERVICE_NAME=${{ steps.env.outputs.SERVICE_NAME }},_ENVIRONMENT=${{ steps.env.outputs.ENVIRONMENT }},_DEPLOY=$DEPLOY \
            --gcs-log-dir=gs://floofgg_cloudbuild/logs \
            .
