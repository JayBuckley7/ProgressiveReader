<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB Reader</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <script type="module" src="{{ url_for('static', filename='js/index.js') }}"></script>
</head>
<body>
    <main>
        <div class="container">
            <h1>Welcome to the EPUB Reader!</h1>
            
            <div class="upload-section">
                <h2>Upload New EPUB</h2>
                <form id="upload-form" class="upload-form" action="#" method="post">
                    <label for="file-input" class="visually-hidden">Select EPUB file</label>
                    <input type="file" name="file" id="file-input" accept=".epub" required>
                    <button type="submit">Upload EPUB</button>
                </form>
                <div id="upload-status"></div>
            </div>

            <div class="bookshelf">
                <h2>My Bookshelf</h2>
                <div id="recent-books-grid" class="books-grid">
                    <!-- Books will be listed here by JavaScript module -->
                </div>
            </div>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="flash-messages">
                    <strong>Notifications:</strong>
                    <ul>
                    {% for message in messages %}
                      <li>{{ message }}</li>
                    {% endfor %}
                    </ul>
                </div>
              {% endif %}
            {% endwith %}
        </div>
    </main>
</body>
</html>
