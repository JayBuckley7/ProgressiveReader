<section class="hero-banner">
  <div class="hero-content">
    <div class="logo-container" style="position: relative; display: inline-block">
      <img src="{{ url_for('static', filename='icons/slow.gif', _external=True) }}?nocache={{ range(1, 1000000) | random }}" alt="Animation" class="hero-logo" />
    </div>
    <h1 class="hero-headline">Your Digital Bookshelf, Reimagined.</h1>
    <p class="hero-tagline">
      Upload books in EPUB, PDF, MOBI, DOCX, or TXT format, read anywhere, and enhance your language learning.
    </p>
    <form id="upload-form" class="hero-upload-form" action="#" method="post">
      <label for="file-input" class="custom-file-upload-label"><span>Select Book File</span></label>
      <input type="file" name="file" id="file-input" accept=".epub,.docx,.pdf,.txt,.mobi" required />
      {% include 'components/drive_button.html' %}
      <div class="upload-progress-container" style="display: none; width: 100%; background-color: #e0e0e0; border-radius: 4px; margin-top: 0.5rem;">
        <div class="upload-progress-bar" style="width: 0%; height: 10px; background-color: #4b8dff; border-radius: 4px;"></div>
      </div>
    </form>
    <div id="upload-status" class="hero-upload-status"></div>
  </div>
</section>
