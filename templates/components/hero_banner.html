<section class="bg-gradient-to-br from-blue-500 to-violet-600 text-white p-6 text-center flex flex-col items-center justify-center min-h-[35vh]">
  <div class="max-w-xl">
    <div class="inline-block relative">
      <img src="{{ url_for('static', filename='icons/slow.gif', _external=True) }}?nocache={{ range(1, 1000000) | random }}" alt="Animation" class="w-16 h-16 mb-4 rounded-lg shadow" />
    </div>
    <h1 class="text-3xl font-bold mt-0 mb-2">Your Digital Bookshelf, Reimagined.</h1>
    <p class="text-base mb-6 opacity-90">
      Upload books in EPUB, PDF, MOBI, DOCX, or TXT format, read anywhere, and enhance your language learning.
    </p>
    <form id="upload-form" class="flex flex-col items-center gap-4 w-full" action="#" method="post">
      <label for="file-input" class="cursor-pointer bg-white/90 text-blue-500 font-semibold px-4 py-2 rounded-full shadow transition hover:bg-white w-full max-w-[280px]"><span>Select Book File</span></label>
      <input type="file" name="file" id="file-input" accept=".epub,.docx,.pdf,.txt,.mobi" required class="sr-only" />
      {% include 'components/drive_button.html' %}
      <div class="upload-progress-container hidden w-full bg-gray-300 rounded mt-2">
        <div class="upload-progress-bar w-0 h-2 bg-blue-500 rounded"></div>
      </div>
    </form>
    <div id="upload-status" class="hero-upload-status"></div>
  </div>
</section>
