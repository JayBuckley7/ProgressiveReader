<div id="side-drawer">
    <button class="close-btn" onclick="closeDrawer()">&times;</button>
    <h4 class="text-lg font-semibold mb-2">Table of Contents</h4>
    {% if toc %}
        {% for entry in toc %}
            <a href="{{ url_for('reader.read_item', book_id=book_id, item_index=entry.index) }}" title="{{ entry.title }}" class="block pl-8 py-1 hover:underline">{{ entry.title }}</a>
        {% endfor %}
    {% else %}
        <p class="pl-8 text-gray-500">No Table of Contents found.</p>
    {% endif %}
</div>
