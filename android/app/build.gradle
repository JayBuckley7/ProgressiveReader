plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localProps.load(localPropsFile.newDataInputStream())
}
def backendUrl = localProps.getProperty('BASE_URL', 'https://your-backend.example.com')

android {
    namespace "com.example.progressivereader"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.progressivereader"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        buildConfigField 'String', 'BASE_URL', '"' + backendUrl + '"'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion "1.5.11"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.16.0"

    // Jetpack Compose + Material 3
    implementation platform("androidx.compose:compose-bom:2025.06.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"

    // Classic MaterialComponents (required by values.xml theme)
    implementation "com.google.android.material:material:1.11.0"

    // Networking / coroutines
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Document support
    implementation 'com.github.barteksc:AndroidPdfViewer:3.1.0-beta.1'
    implementation 'com.github.FolioReader:FolioReader-Android:0.5.4'
    implementation 'com.github.kittinunf.fuel:fuel:2.3.1'
    implementation 'com.github.kittinunf.fuel:fuel-android:2.3.1'
    implementation 'org.jsoup:jsoup:1.20.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jsoup:jsoup:1.20.1'
}
