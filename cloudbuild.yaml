steps:
  # 1. Build Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    id: Build Docker Image
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/progressivereader:$COMMIT_SHA', '.']

  # 2. Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: Push to Container Registry
    waitFor: [Build Docker Image]
    args: ['push', 'gcr.io/$PROJECT_ID/progressivereader:$COMMIT_SHA']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: Deploy to Cloud Run
    waitFor: [Push to Container Registry]
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'progressivereader', 
      '--image', 'gcr.io/$PROJECT_ID/progressivereader:$COMMIT_SHA', 
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--set-env-vars=FLASK_ENV=production'
    ]

  # 4. Deploy the Cloud Run indexer service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: Deploy Cloud Run Indexer
    waitFor: [Deploy to Cloud Run]
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'progressivereader-indexer'
      - '--image'
      - 'gcr.io/$PROJECT_ID/progressivereader-indexer:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID'

images:
  - 'gcr.io/$PROJECT_ID/progressivereader:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/progressivereader-indexer:$COMMIT_SHA'

timeout: "1200s"
