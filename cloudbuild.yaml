steps:
  # 1. Build Docker image and tag with commit SHA and latest
  - name: "gcr.io/cloud-builders/docker"
    id: "Build Docker Image"
    args:
      - "build"
      - "--build-arg"
      - "VITE_CLERK_PUBLISHABLE_KEY=${_VITE_CLERK_PUBLISHABLE_KEY}"
      - "--build-arg"
      - "VITE_GDRIVE_CLIENT_ID=${_VITE_GDRIVE_CLIENT_ID}"
      - "--build-arg"
      - "VITE_GAPI_KEY=${_VITE_GAPI_KEY}"
      - "--build-arg"
      - "CLERK_SECRET_KEY=${_CLERK_SECRET_KEY}"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/progressive-reader/${_SERVICE_NAME}:${_COMMIT_SHA}"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/progressive-reader/${_SERVICE_NAME}:latest"
      - "."

  # 2. Push image with commit SHA tag
  - name: "gcr.io/cloud-builders/docker"
    id: "Push to Artifact Registry"
    waitFor: ["Build Docker Image"]
    args:
      - "push"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/progressive-reader/${_SERVICE_NAME}:${_COMMIT_SHA}"

  # 3. Push latest tag
  - name: "gcr.io/cloud-builders/docker"
    id: "Push latest tag"
    waitFor: ["Build Docker Image"]
    args:
      - "push"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/progressive-reader/${_SERVICE_NAME}:latest"

  # 4. Create/Update app-config secret with environment variables
  - name: "gcr.io/cloud-builders/gcloud"
    id: "Update App Config Secret"
    waitFor: ["Push to Artifact Registry"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
          echo "🔧 Creating/updating app-config secret from substitution variables..."
          
          # Create JSON content from substitution variables
          cat > /tmp/app-config.json << EOF
          {
            "VITE_CLERK_PUBLISHABLE_KEY": "${_VITE_CLERK_PUBLISHABLE_KEY}",
            "CLERK_SECRET_KEY": "${_CLERK_SECRET_KEY}",
            "VITE_GDRIVE_CLIENT_ID": "${_VITE_GDRIVE_CLIENT_ID}",
            "VITE_GAPI_KEY": "${_VITE_GAPI_KEY}",
            "OPENAI_API_KEYS": ${_OPENAI_API_KEYS_JSON:-"[]"}
          }
          EOF
          
          # Validate JSON format
          cat /tmp/app-config.json | jq . > /dev/null || (echo "❌ Generated JSON is not valid" && cat /tmp/app-config.json && exit 1)
          
          echo "✅ Generated app-config JSON:"
          cat /tmp/app-config.json | jq -r 'keys[]'
          
          # Create or update the secret
          if gcloud secrets describe app-config --project=$PROJECT_ID >/dev/null 2>&1; then
            echo "📝 Updating existing app-config secret..."
            gcloud secrets versions add app-config --data-file=/tmp/app-config.json --project=$PROJECT_ID
          else
            echo "🆕 Creating new app-config secret..."
            gcloud secrets create app-config --data-file=/tmp/app-config.json --project=$PROJECT_ID
          fi
          
          echo "✅ app-config secret updated successfully"
          
          # Verify the secret content (for debugging)
          echo "🔍 Verifying secret content..."
          gcloud secrets versions access latest --secret=app-config --project=$PROJECT_ID | jq -r 'keys[]' | head -5
          echo "✅ Secret verification complete"

  # 5. Run build verification tests against health endpoint only (moved to after secret update)
  - name: "gcr.io/cloud-builders/gcloud"
    id: "BVT-Pre-Deploy"
    waitFor: ["Update App Config Secret"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
          SERVICE_URL=$(gcloud run services describe ${_SERVICE_NAME} --platform managed --region us-central1 --format 'value(status.url)')
          
          # Test: Health check only (before deployment)
          HEALTH_CHECK_URL="$$SERVICE_URL/health"
          echo "Pre-deployment BVT: Checking health at: $$HEALTH_CHECK_URL"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 -I "$$HEALTH_CHECK_URL" || (echo "Pre-deployment BVT failed for $$HEALTH_CHECK_URL" && exit 1)
          echo "✅ Pre-deployment health check passed"

  # 6. Deploy to Cloud Run
  - name: "gcr.io/cloud-builders/gcloud"
    id: "Deploy to Cloud Run"
    waitFor: ["BVT-Pre-Deploy"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
          gcloud run deploy ${_SERVICE_NAME} \
            --image us-central1-docker.pkg.dev/$PROJECT_ID/progressive-reader/${_SERVICE_NAME}:${_COMMIT_SHA} \
            --service-account progressive-reader-bvt-sa@$PROJECT_ID.iam.gserviceaccount.com \
            --set-secrets /secrets/env.json=app-config:latest \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars APP_ENV=${_ENVIRONMENT} \
            --vpc-connector floof-connector \
            --vpc-egress private-ranges-only \
            --memory 512Mi \
            --concurrency 80 \
            --max-instances 40 \
            --timeout 300 \
            --execution-environment gen2

  # 7. Post-deployment verification including OpenAI keys and Clerk configuration
  - name: "gcr.io/cloud-builders/gcloud"
    id: "BVT-Post-Deploy" 
    waitFor: ["Deploy to Cloud Run"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
          SERVICE_URL=$(gcloud run services describe ${_SERVICE_NAME} --platform managed --region us-central1 --format 'value(status.url)')
          
          # Test 1: Health check (now includes Clerk validation)
          HEALTH_CHECK_URL="$$SERVICE_URL/health"
          echo "Post-deployment BVT 1/3: Checking health at: $$HEALTH_CHECK_URL"
          HEALTH_RESPONSE=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$$HEALTH_CHECK_URL") || (echo "Post-deployment BVT failed for $$HEALTH_CHECK_URL" && exit 1)
          echo "Health check response: $$HEALTH_RESPONSE"
          
          # Validate Clerk configuration from health check
          CLERK_HEALTHY=$(echo "$$HEALTH_RESPONSE" | grep -o '"clerk_overall_healthy"[[:space:]]*:[[:space:]]*true' | wc -l)
          if [ "$$CLERK_HEALTHY" -eq 1 ]; then
            echo "✅ Health check passed (including Clerk configuration)"
          else
            echo "❌ BVT failed - Clerk configuration issue detected in health check"
            echo "Health response: $$HEALTH_RESPONSE"
            exit 1
          fi
          
          # Test 2: OpenAI key configuration check
          OPENAI_CHECK_URL="$$SERVICE_URL/api/openai_key_configured"
          echo "Post-deployment BVT 2/3: Checking OpenAI key configuration at: $$OPENAI_CHECK_URL"
          OPENAI_RESPONSE=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$$OPENAI_CHECK_URL") || (echo "Post-deployment BVT failed - could not reach $$OPENAI_CHECK_URL" && exit 1)
          
          # Parse and validate the response
          echo "OpenAI configuration response: $$OPENAI_RESPONSE"
          CONFIGURED=$(echo "$$OPENAI_RESPONSE" | grep -o '"openai_key_configured"[[:space:]]*:[[:space:]]*true' | wc -l)
          POOL_SIZE=$(echo "$$OPENAI_RESPONSE" | grep -o '"pool_size"[[:space:]]*:[[:space:]]*[0-9]\+' | grep -o '[0-9]\+')
          
          if [ "$$CONFIGURED" -eq 1 ] && [ "$$POOL_SIZE" -gt 0 ]; then
            echo "✅ OpenAI keys configured correctly (pool_size: $$POOL_SIZE)"
          else
            echo "❌ Post-deployment BVT failed - OpenAI keys not properly configured"
            echo "Expected: openai_key_configured=true and pool_size>0"
            echo "Got: $$OPENAI_RESPONSE"
            exit 1
          fi
          
          # Test 3: Specific Clerk publishable key validation
          echo "Post-deployment BVT 3/3: Validating Clerk publishable key is available for frontend"
          CLERK_PUB_CONFIGURED=$(echo "$$HEALTH_RESPONSE" | grep -o '"clerk_publishable_key_configured"[[:space:]]*:[[:space:]]*true' | wc -l)
          CLERK_SECRET_CONFIGURED=$(echo "$$HEALTH_RESPONSE" | grep -o '"clerk_secret_key_configured"[[:space:]]*:[[:space:]]*true' | wc -l)
          
          if [ "$$CLERK_PUB_CONFIGURED" -eq 1 ] && [ "$$CLERK_SECRET_CONFIGURED" -eq 1 ]; then
            echo "✅ Clerk keys configured correctly (both publishable and secret keys present)"
          else
            echo "❌ Post-deployment BVT failed - Missing Clerk Publishable Key or Secret Key"
            echo "This is likely due to app-config secret not being properly mounted or parsed"
            echo "clerk_publishable_key_configured: $$CLERK_PUB_CONFIGURED (should be 1)"
            echo "clerk_secret_key_configured: $$CLERK_SECRET_CONFIGURED (should be 1)"
            echo "Full health response: $$HEALTH_RESPONSE"
            exit 1
          fi
          
          echo "🎉 All post-deployment BVT checks passed!"

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/progressive-reader/${_SERVICE_NAME}:${_COMMIT_SHA}"

timeout: "1200s" 
