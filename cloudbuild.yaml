steps:
  # 1. Build Docker Image
  - name: gcr.io/cloud-builders/docker
    id: Build Docker Image
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/progressive-reader/${_SERVICE_NAME}:${COMMIT_SHA}
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/progressive-reader/${_SERVICE_NAME}:latest
      - .

  # 2. Push to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    id: Push to Artifact Registry
    waitFor: [Build Docker Image]
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/progressive-reader/${_SERVICE_NAME}:${COMMIT_SHA}

  - name: gcr.io/cloud-builders/docker
    id: Push latest tag
    waitFor: [Build Docker Image]
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/progressive-reader/${_SERVICE_NAME}:latest

  # 3. Deploy to Cloud Run (with VPC access)
  - name: gcr.io/cloud-builders/gcloud
    id: Deploy to Cloud Run
    waitFor: [Push to Artifact Registry, Push latest tag]
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy ${_SERVICE_NAME} \
          --image=us-central1-docker.pkg.dev/$PROJECT_ID/progressive-reader/${_SERVICE_NAME}:${COMMIT_SHA} \
          --service-account=progressive-reader-bvt-sa@${PROJECT_ID}.iam.gserviceaccount.com \
          --set-secrets=SECRET_KEY=secret-key:latest \
          --region=us-central1 \
          --platform=managed \
          --allow-unauthenticated \
          --set-env-vars=APP_ENV=${_ENVIRONMENT} \
          --project=$PROJECT_ID \
          --vpc-connector=floof-connector \
          --vpc-egress=private-ranges-only \
          --port=8080 \
          --memory=1Gi \
          --cpu=1 \
          --max-instances=10 \
          --min-instances=0 \
          --timeout=300

  # 4. Run Build Verification Tests (BVT)
  - name: gcr.io/cloud-builders/gcloud
    id: BVT
    waitFor: [Deploy to Cloud Run]
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SERVICE_URL=$(gcloud run services describe $_SERVICE_NAME --platform managed --region us-central1 --format 'value(status.url)')
        HEALTH_CHECK_URL="$${SERVICE_URL}/health"
        echo "Performing BVT by checking health at: $${HEALTH_CHECK_URL}"
        curl --fail --silent --show-error --connect-timeout 10 --max-time 20 -I "$${HEALTH_CHECK_URL}" || \
          (echo "BVT failed for $${HEALTH_CHECK_URL}" && exit 1)
        echo "BVT passed for $${HEALTH_CHECK_URL}"

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/progressive-reader/${_SERVICE_NAME}:${COMMIT_SHA}

timeout: "1200s"

# Substitutions for variables passed from GitHub Actions
substitutions:
  _SERVICE_NAME: 'progressive-reader'
  _ENVIRONMENT: 'prod'

options:
  # pick one, or delete this line entirely to keep both targets
  logging: GCS_ONLY          # or CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'