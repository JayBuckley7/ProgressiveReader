steps:
  # 1. Build
  - name: gcr.io/cloud-builders/docker
    id: Build Docker Image
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/progressive-reader:$COMMIT_SHA
      - .

  # 2. Push
  - name: gcr.io/cloud-builders/docker
    id: Push to Artifact Registry
    waitFor: [Build Docker Image]
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/progressive-reader:$COMMIT_SHA

  # 3. Deploy
  - name: gcr.io/cloud-builders/gcloud        # ← switch to this image
    id: Deploy to Cloud Run
    waitFor: [Push to Artifact Registry]
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy progressive-reader \
          --image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/progressive-reader:$COMMIT_SHA \
          --region=us-central1 \
          --platform=managed \
          --allow-unauthenticated \
          --project=$PROJECT_ID

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/progressive-reader:$COMMIT_SHA

timeout: "1200s"
