timeout: "1200s"

options:
  substitutionOption: ALLOW_LOOSE

substitutions:
  _SERVICE_NAME: "progressive-reader"     # change if needed
  _COMMIT_SHA: "$COMMIT_SHA"
  _ENVIRONMENT: "prod"

steps:
  # 1) Load & parse frontend env vars (from Secret Manager) safely with jq
  - name: "gcr.io/cloud-builders/gcloud"
    id: "Load Frontend Env Vars"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        echo "📦 Loading frontend environment variables from PR-app-config..."

        apt-get update -y >/dev/null && apt-get install -y jq >/dev/null

        SECRET_CONTENT="$$(gcloud secrets versions access latest --secret=PR-app-config --project="$$PROJECT_ID")"

        VITE_CLERK_PUBLISHABLE_KEY="$$(printf %s "$$SECRET_CONTENT" | jq -r '.VITE_CLERK_PUBLISHABLE_KEY // empty')"
        VITE_GDRIVE_CLIENT_ID="$$(printf %s "$$SECRET_CONTENT" | jq -r '.VITE_GDRIVE_CLIENT_ID // empty')"
        VITE_GAPI_KEY="$$(printf %s "$$SECRET_CONTENT" | jq -r '.VITE_GAPI_KEY // empty')"

        [ -n "$$VITE_CLERK_PUBLISHABLE_KEY" ] || { echo "❌ Missing VITE_CLERK_PUBLISHABLE_KEY"; exit 1; }
        [ -n "$$VITE_GDRIVE_CLIENT_ID" ]      || { echo "❌ Missing VITE_GDRIVE_CLIENT_ID"; exit 1; }
        [ -n "$$VITE_GAPI_KEY" ]              || { echo "❌ Missing VITE_GAPI_KEY"; exit 1; }

        printf %s "$$VITE_CLERK_PUBLISHABLE_KEY" > /workspace/vite_clerk_key.txt
        printf %s "$$VITE_GDRIVE_CLIENT_ID"     > /workspace/vite_gdrive_client.txt
        printf %s "$$VITE_GAPI_KEY"             > /workspace/vite_gapi_key.txt

        echo "✅ Frontend environment variables extracted"

  # 2) Build Docker image with ONLY the frontend build args
  - name: "gcr.io/cloud-builders/docker"
    id: "Build Docker Image"
    waitFor: ["Load Frontend Env Vars"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        VITE_CLERK_PUBLISHABLE_KEY="$$(tr -d '\r\n' < /workspace/vite_clerk_key.txt)"
        VITE_GDRIVE_CLIENT_ID="$$(tr -d '\r\n' < /workspace/vite_gdrive_client.txt)"
        VITE_GAPI_KEY="$$(tr -d '\r\n' < /workspace/vite_gapi_key.txt)"

        echo "🔨 Building Docker image (frontend build args only)..."
        docker build \
          --build-arg VITE_CLERK_PUBLISHABLE_KEY="$$VITE_CLERK_PUBLISHABLE_KEY" \
          --build-arg VITE_GDRIVE_CLIENT_ID="$$VITE_GDRIVE_CLIENT_ID" \
          --build-arg VITE_GAPI_KEY="$$VITE_GAPI_KEY" \
          -t us-central1-docker.pkg.dev/$$PROJECT_ID/progressive-reader/${_SERVICE_NAME}:${_COMMIT_SHA} \
          -t us-central1-docker.pkg.dev/$$PROJECT_ID/progressive-reader/${_SERVICE_NAME}:latest \
          .

  # 3) Push image with commit SHA tag
  - name: "gcr.io/cloud-builders/docker"
    id: "Push to Artifact Registry"
    waitFor: ["Build Docker Image"]
    args:
      - "push"
      - "us-central1-docker.pkg.dev/$$PROJECT_ID/progressive-reader/${_SERVICE_NAME}:${_COMMIT_SHA}"

  # 4) Push latest tag
  - name: "gcr.io/cloud-builders/docker"
    id: "Push latest tag"
    waitFor: ["Build Docker Image"]
    args:
      - "push"
      - "us-central1-docker.pkg.dev/$$PROJECT_ID/progressive-reader/${_SERVICE_NAME}:latest"

  # 5) Verify PR-app-config secret exists and has expected keys
  - name: "gcr.io/cloud-builders/gcloud"
    id: "Verify PR-App Config Secret"
    waitFor: ["Push to Artifact Registry"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        echo "🔍 Verifying PR-app-config secret exists and contents..."

        if gcloud secrets describe PR-app-config --project="$$PROJECT_ID" >/dev/null 2>&1; then
          echo "✅ PR-app-config secret found"
          SECRET_CONTENT="$$(gcloud secrets versions access latest --secret=PR-app-config --project="$$PROJECT_ID")"

          echo "$$SECRET_CONTENT" | grep -q '"OPENAI_API_KEYS"'            && echo "✅ OPENAI_API_KEYS found" || (echo "❌ OPENAI_API_KEYS missing" && exit 1)
          echo "$$SECRET_CONTENT" | grep -q '"CLERK_SECRET_KEY"'           && echo "✅ CLERK_SECRET_KEY found" || (echo "❌ CLERK_SECRET_KEY missing" && exit 1)
          echo "$$SECRET_CONTENT" | grep -q '"VITE_CLERK_PUBLISHABLE_KEY"' && echo "✅ VITE_CLERK_PUBLISHABLE_KEY found" || (echo "❌ VITE_CLERK_PUBLISHABLE_KEY missing" && exit 1)
          echo "✅ PR-app-config secret verification complete"
        else
          echo "❌ PR-app-config secret not found. Please create it first."
          exit 1
        fi

  # 6) Pre-deploy health (skip if service not found yet)
  - name: "gcr.io/cloud-builders/gcloud"
    id: "BVT-Pre-Deploy"
    waitFor: ["Verify PR-App Config Secret"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        if gcloud run services describe ${_SERVICE_NAME} --platform managed --region us-central1 >/dev/null 2>&1; then
          SERVICE_URL=$$(gcloud run services describe ${_SERVICE_NAME} --platform managed --region us-central1 --format 'value(status.url)')
          HEALTH_CHECK_URL="$$SERVICE_URL/health"
          echo "Pre-deployment BVT: GET $$HEALTH_CHECK_URL"
          STATUS_CODE=$$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 20 "$$HEALTH_CHECK_URL")
          [ "$$STATUS_CODE" -ge 200 ] && [ "$$STATUS_CODE" -lt 400 ] || (echo "Pre-deployment BVT failed ($$STATUS_CODE) for $$HEALTH_CHECK_URL" && exit 1)
          echo "✅ Pre-deployment health check passed"
        else
          echo "ℹ️ Service ${_SERVICE_NAME} not found yet; skipping pre-deployment health check."
        fi

  # 7) Deploy (no-traffic), wait for the newly created REVISION to be Ready, then route traffic
  - name: "gcr.io/cloud-builders/gcloud"
    id: "Deploy to Cloud Run"
    waitFor: ["BVT-Pre-Deploy"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail

        # Deploy new revision with NO traffic
        gcloud run deploy ${_SERVICE_NAME} \
          --image us-central1-docker.pkg.dev/$$PROJECT_ID/progressive-reader/${_SERVICE_NAME}:${_COMMIT_SHA} \
          --service-account progressive-reader-bvt-sa@$$PROJECT_ID.iam.gserviceaccount.com \
          --set-secrets /secrets/env.json=PR-app-config:latest \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars APP_ENV=${_ENVIRONMENT} \
          --vpc-connector floof-connector \
          --vpc-egress private-ranges-only \
          --memory 1Gi \
          --concurrency 80 \
          --max-instances 40 \
          --timeout 300 \
          --execution-environment gen2 \
          --no-traffic

        # Figure out the latest created revision name (v2/v1 compatible)
        CREATED="$$(gcloud run services describe ${_SERVICE_NAME} --platform managed --region us-central1 --format='value(status.latestCreatedRevision)')"
        if [ -z "$$CREATED" ]; then
          CREATED="$$(gcloud run services describe ${_SERVICE_NAME} --platform managed --region us-central1 --format='value(status.latestCreatedRevisionName)')"
        fi
        if [ -z "$$CREATED" ]; then
          echo "❌ Unable to determine latest created revision name"
          exit 1
        fi
        echo "🆕 Latest created revision: $$CREATED"

        echo "⏳ Waiting for revision $$CREATED to become Ready..."
        READY_OK=0
        # Wait up to ~8 minutes (48 * 10s)
        for i in $$(seq 1 48); do
          # Try terminalCondition.state (v2), then conditions[].status (v1), then conditions[].state (alt)
          READY_STATE="$$(gcloud run revisions describe "$$CREATED" --platform managed --region us-central1 --format='value(status.terminalCondition.state)')"
          if [ -z "$$READY_STATE" ]; then
            READY_STATE="$$(gcloud run revisions describe "$$CREATED" --platform managed --region us-central1 --format='value(status.conditions[?type=Ready].status)')"
          fi
          if [ -z "$$READY_STATE" ]; then
            READY_STATE="$$(gcloud run revisions describe "$$CREATED" --platform managed --region us-central1 --format='value(status.conditions[?type=Ready].state)')"
          fi

          if [ "$$READY_STATE" = "True" ]; then
            echo "✅ Revision $$CREATED is Ready"
            READY_OK=1
            break
          fi

          REASON="$$(gcloud run revisions describe "$$CREATED" --platform managed --region us-central1 --format='value(status.terminalCondition.reason)')"
          MESSAGE="$$(gcloud run revisions describe "$$CREATED" --platform managed --region us-central1 --format='value(status.terminalCondition.message)')"
          echo "⏳ Still waiting... (state=$${READY_STATE:-unknown} reason=$${REASON:-''})"
          if [ -n "$$MESSAGE" ]; then echo "   ↳ $$MESSAGE"; fi
          sleep 10
        done

        if [ "$$READY_OK" -ne 1 ]; then
          echo "❌ Revision $$CREATED did not become Ready in time."
          # Show the last conditions to aid debugging
          gcloud run revisions describe "$$CREATED" --platform managed --region us-central1 --format='yaml(status)'
          exit 1
        fi

        echo "🚀 Promoting new revision to serve traffic..."
        # You can pin to the created revision explicitly to avoid races:
        gcloud run services update-traffic ${_SERVICE_NAME} --region us-central1 --to-revisions "$$CREATED=100"

  # 8) Post-deploy verification (non-blocking)
  - name: "gcr.io/cloud-builders/gcloud"
    id: "BVT-Post-Deploy"
    waitFor: ["Deploy to Cloud Run"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        SERVICE_URL=$$(gcloud run services describe ${_SERVICE_NAME} --platform managed --region us-central1 --format 'value(status.url)')

        # Test 1: Health check & Clerk flags
        HEALTH_CHECK_URL="$$SERVICE_URL/health"
        echo "Post-deploy BVT 1/3: $$HEALTH_CHECK_URL"
        set +e
        HEALTH_RESPONSE=$$(curl --silent --show-error --connect-timeout 10 --max-time 20 "$$HEALTH_CHECK_URL")
        curl_status=$$?
        set -e
        if [ $$curl_status -ne 0 ] || [ -z "$$HEALTH_RESPONSE" ]; then
          echo "⚠️ Health endpoint unavailable or empty; continuing."
          HEALTH_RESPONSE='{}'
        else
          echo "Health: $$HEALTH_RESPONSE"
        fi

        CLERK_OVERALL=$$(echo "$$HEALTH_RESPONSE" | grep -o '"clerk_overall_healthy"[[:space:]]*:[[:space:]]*\(true\|false\)' | grep -o '\(true\|false\)')
        CLERK_PUB_CONFIGURED=$$(echo "$$HEALTH_RESPONSE" | grep -o '"clerk_publishable_key_configured"[[:space:]]*:[[:space:]]*\(true\|false\)' | grep -o '\(true\|false\)')
        CLERK_SECRET_CONFIGURED=$$(echo "$$HEALTH_RESPONSE" | grep -o '"clerk_secret_key_configured"[[:space:]]*:[[:space:]]*\(true\|false\)' | grep -o '\(true\|false\)')

        echo "📊 Clerk:"
        echo "  - overall_healthy: $${CLERK_OVERALL:-unknown}"
        echo "  - publishable_key_configured: $${CLERK_PUB_CONFIGURED:-unknown}"
        echo "  - secret_key_configured: $${CLERK_SECRET_CONFIGURED:-unknown}"

        # Test 2: OpenAI key pool check (best-effort)
        OPENAI_CHECK_URL="$$SERVICE_URL/api/openai_key_configured"
        echo "Post-deploy BVT 2/3: $$OPENAI_CHECK_URL"
        set +e
        OPENAI_RESPONSE=$$(curl --silent --show-error --connect-timeout 10 --max-time 20 "$$OPENAI_CHECK_URL")
        curl_status=$$?
        set -e
        if [ $$curl_status -ne 0 ] || [ -z "$$OPENAI_RESPONSE" ]; then
          echo "⚠️ OpenAI configuration endpoint unavailable; continuing."
          OPENAI_RESPONSE='{}'
        fi
        echo "OpenAI: $$OPENAI_RESPONSE"
        CONFIGURED=$$(echo "$$OPENAI_RESPONSE" | grep -o '"openai_key_configured"[[:space:]]*:[[:space:]]*true' | wc -l)
        POOL_SIZE=$$(echo "$$OPENAI_RESPONSE" | grep -o '"pool_size"[[:space:]]*:[[:space:]]*[0-9]\+' | grep -o '[0-9]\+')
        if [ "$$CONFIGURED" -eq 1 ] && [ "$${POOL_SIZE:-0}" -gt 0 ]; then
          echo "✅ OpenAI pool looks healthy (pool_size=$$POOL_SIZE)"
        else
          echo "⚠️ Unable to confirm OpenAI pool configuration; continuing."
        fi

        # Test 3: Confirm both Clerk keys seen by backend
        echo "Post-deploy BVT 3/3: Checking Clerk flags again"
        if [ "$$CLERK_PUB_CONFIGURED" = "true" ] && [ "$$CLERK_SECRET_CONFIGURED" = "true" ]; then
          echo "✅ Clerk keys confirmed"
        else
          echo "⚠️ Clerk key confirmation incomplete."
        fi

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/progressive-reader/${_SERVICE_NAME}:${_COMMIT_SHA}"
