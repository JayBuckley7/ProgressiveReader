timeout: "1200s"

options:
  substitutionOption: ALLOW_LOOSE

substitutions:
  _SERVICE_NAME: "progressive-reader"   # change if needed
  _ENVIRONMENT: "prod"
  _COMMIT_SHA: "$COMMIT_SHA"  # Default to built-in COMMIT_SHA if not provided

steps:
  # 1) Load & parse frontend env vars (from Secret Manager) safely with jq
  - name: "gcr.io/cloud-builders/gcloud"
    id: "Load Frontend Env Vars"
    entrypoint: "bash"
    args: ["ci/01-load-frontend-env.sh"]
    env:
      - "PROJECT_ID=${PROJECT_ID}"

  # 2) Build Docker image with ONLY the frontend build args
  - name: "gcr.io/cloud-builders/docker"
    id: "Build Docker Image"
    waitFor: ["Load Frontend Env Vars"]
    entrypoint: "bash"
    args: ["ci/02-build-docker.sh"]
    env:
      - "_SERVICE_NAME=${_SERVICE_NAME}"
      - "PROJECT_ID=${PROJECT_ID}"
      - "_COMMIT_SHA=${_COMMIT_SHA}"

  # 3) Push image with commit SHA tag
  - name: "gcr.io/cloud-builders/docker"
    id: "Push to Artifact Registry"
    waitFor: ["Build Docker Image"]
    args:
      - "push"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/progressive-reader/${_SERVICE_NAME}:${_COMMIT_SHA}"

  # 4) Push latest tag
  - name: "gcr.io/cloud-builders/docker"
    id: "Push latest tag"
    waitFor: ["Build Docker Image"]
    args:
      - "push"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/progressive-reader/${_SERVICE_NAME}:latest"

  # 5) Verify PR-app-config secret exists and has expected keys
  - name: "gcr.io/cloud-builders/gcloud"
    id: "Verify PR-App Config Secret"
    waitFor: ["Push to Artifact Registry"]
    entrypoint: "bash"
    args: ["ci/05-verify-secret.sh"]
    env:
      - "PROJECT_ID=${PROJECT_ID}"
  
  # 5b) Verify secret can be parsed as JSON (handles UTF-8 BOM)
  - name: "gcr.io/cloud-builders/gcloud"
    id: "Verify Secret Parsing"
    waitFor: ["Verify PR-App Config Secret"]
    entrypoint: "bash"
    args: ["ci/05-verify-secret-parsing.sh"]
    env:
      - "PROJECT_ID=${PROJECT_ID}"

  # 6) Pre-deploy health (skip if service not found yet)
  - name: "gcr.io/cloud-builders/gcloud"
    id: "BVT-Pre-Deploy"
    waitFor: ["Verify Secret Parsing"]
    entrypoint: "bash"
    args: ["ci/06-pre-deploy-bvt.sh"]
    env:
      - "_SERVICE_NAME=${_SERVICE_NAME}"
      - "PROJECT_ID=${PROJECT_ID}"

  # 7) Deploy (no-traffic), wait for the newly created REVISION to be Ready, then route traffic
  - name: "gcr.io/cloud-builders/gcloud"
    id: "Deploy to Cloud Run"
    waitFor: ["BVT-Pre-Deploy"]
    entrypoint: "bash"
    args: ["ci/07-deploy.sh"]
    env:
      - "_SERVICE_NAME=${_SERVICE_NAME}"
      - "PROJECT_ID=${PROJECT_ID}"
      - "_COMMIT_SHA=${_COMMIT_SHA}"
      - "_ENVIRONMENT=${_ENVIRONMENT}"

  # 8) Post-deploy verification (non-blocking)
  - name: "gcr.io/cloud-builders/gcloud"
    id: "BVT-Post-Deploy"
    waitFor: ["Deploy to Cloud Run"]
    entrypoint: "bash"
    args: ["ci/08-post-deploy-bvt.sh"]
    env:
      - "_SERVICE_NAME=${_SERVICE_NAME}"
      - "PROJECT_ID=${PROJECT_ID}"

images:
  - "us-central1-docker.pkg.dev/${PROJECT_ID}/progressive-reader/${_SERVICE_NAME}:${_COMMIT_SHA}"
